# Production topology for the AWS EC2 box.
#
# Contrast with docker-compose.yml (local dev), which BUILDS the app from source
# and runs a local MongoDB container. Production does neither:
#   - image  — pulls the prebuilt image from GHCR (pushed by CI on merge to main),
#              instead of `build: .`. No source on the box, no build step.
#   - no db  — persistence is MongoDB Atlas (managed, off-box). The app reaches it
#              via MONGO_URI, which user_data fetches from SSM Parameter Store at
#              boot and writes to .env (kept next to this file, git-ignored, never
#              committed). Hence env_file rather than inline environment.
#
# The box runs:  docker compose -f docker-compose.prod.yml up -d
services:
  app:
    image: ghcr.io/matt-brinster/task-tracker:latest
    # No published port. Caddy reaches this over the compose network as app:3000,
    # so the app is not bound to any host interface at all — not even loopback.
    # (Consequence: `curl localhost:3000/healthz` on the box no longer works. Probe
    # through Caddy instead, or `docker compose exec app` to get inside the network.)
    env_file:
      # MONGO_URI (and any other prod secrets) land here at boot, decrypted from
      # SSM. Relative to this file's directory (/opt/task-tracker on the box).
      - .env
    environment:
      # Non-secret config lives here (versioned with the topology), not in .env.
      # Exactly one proxy hop now sits in front of the app: Caddy, below. It sets
      # X-Forwarded-For, and trusting that one hop is what lets req.ip see the real
      # client instead of Caddy's container address — which the per-IP auth rate
      # limiter depends on. Trusting one hop is safe precisely because the app has
      # no host port: every request provably arrives via Caddy.
      TRUST_PROXY_HOPS: 1
    healthcheck:
      # The runtime image is node:slim (no curl/wget), so node itself is the
      # probe — global fetch needs Node >= 18. NOTE: plain Docker only *marks*
      # the container (unhealthy); it never restarts it for health reasons.
      # This is a diagnostic for `docker compose ps` and a hook for monitoring,
      # not self-healing.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Bring the app back after a crash or host reboot, but respect a deliberate
    # `docker compose stop`. Right policy for a single always-on box.
    restart: unless-stopped

  caddy:
    # The only service exposed to the internet. Terminates TLS and reverse-proxies
    # to app:3000. Automatic HTTPS — see ./Caddyfile for the (short) config and the
    # staging-CA warning.
    image: caddy:2
    ports:
      # 80 is not just a redirect-to-HTTPS courtesy: Let's Encrypt's HTTP-01
      # challenge is served on it, so closing it would break certificate issuance
      # and renewal. Both ports are already open in the security group.
      - "80:80"
      - "443:443"
    volumes:
      # Fetched from main by user_data, next to this file (/opt/task-tracker).
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the ACME account key live in /data — losing it means
      # re-issuing certs, which is rate-limited. These are named volumes on the
      # root EBS, so they survive `compose down` and reboots but NOT an instance
      # replacement. Hence the staging CA while user_data is still churning.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      # Start ordering only — this does NOT wait for the app to be listening. Caddy
      # comes up first and serves 502 until the app finishes its Atlas round-trip
      # and binds :3000; reverse_proxy retries the dial, so that window self-heals.
      # Deliberately NOT `condition: service_healthy`: gating Caddy on app health
      # would also gate ACME issuance/renewal, so an app that can't reach Atlas
      # would take HTTPS certificates down with it.
      - app
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
